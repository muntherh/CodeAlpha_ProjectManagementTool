<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Kanban | Project Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="brand">📋 CodeAlpha Kanban</a>
      <div class="project-controls">
        <select id="project-selector" class="project-select" onchange="switchProject(this.value)">
          <option value="">Loading Projects...</option>
        </select>
        <button onclick="openModal('new-project-modal')" class="btn btn-light">+ New Project</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 1rem;">
      <button onclick="openModal('new-task-modal')" class="btn btn-primary">+ Add Task</button>
      <div id="auth-nav">
        <a href="auth.html" class="btn btn-light">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Kanban 4 Columns -->
  <main class="board-container">
    <div class="kanban-column" id="col-todo" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'todo')">
      <div class="column-header">
        <span style="color: #64748b;">📋 To Do</span>
        <span id="badge-todo" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </div>

    <div class="kanban-column" id="col-in_progress" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'in_progress')">
      <div class="column-header">
        <span style="color: #2563eb;">⚡ In Progress</span>
        <span id="badge-in_progress" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-in_progress"></div>
    </div>

    <div class="kanban-column" id="col-review" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'review')">
      <div class="column-header">
        <span style="color: #d97706;">🔍 In Review</span>
        <span id="badge-review" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-review"></div>
    </div>

    <div class="kanban-column" id="col-done" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'done')">
      <div class="column-header">
        <span style="color: #16a34a;">✅ Completed</span>
        <span id="badge-done" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </div>
  </main>

  <!-- Modal: Create Project -->
  <div id="new-project-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create Group Project</h3>
        <button class="close-btn" onclick="closeModal('new-project-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="create-project-form">
          <div class="form-group">
            <label>Project Title</label>
            <input type="text" id="proj-title" class="form-control" placeholder="e.g. Mobile App v2.0" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="proj-desc" class="form-control" rows="3" placeholder="Brief project scope"></textarea>
          </div>
          <div style="text-align: right; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Create Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Create Task -->
  <div id="new-task-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Task Card</h3>
        <button class="close-btn" onclick="closeModal('new-task-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="create-task-form">
          <div class="form-group">
            <label>Task Title</label>
            <input type="text" id="task-title" class="form-control" placeholder="e.g. Design Landing Page" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="task-desc" class="form-control" rows="3" placeholder="Task specifics"></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label>Priority</label>
              <select id="task-priority" class="form-control">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group">
              <label>Assign To</label>
              <select id="task-assignee" class="form-control">
                <option value="">Unassigned</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="task-duedate" class="form-control">
          </div>
          <div style="text-align: right; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Task Details & Comments -->
  <div id="task-detail-modal" class="modal-overlay">
    <div class="modal-card" style="max-width: 650px;">
      <div class="modal-header">
        <h3 id="modal-task-title">Task Details</h3>
        <button class="close-btn" onclick="closeModal('task-detail-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-task-meta" style="margin-bottom: 1.2rem;"></div>
        <p id="modal-task-desc" style="line-height: 1.6; color: #334155; margin-bottom: 1.5rem;"></p>

        <h4 style="margin-bottom: 0.8rem; font-size: 1.05rem;">💬 Discussion & Updates</h4>
        <div id="modal-comments-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 1rem;"></div>

        <form id="add-comment-form" style="display: flex; gap: 0.5rem;">
          <input type="text" id="comment-input" class="form-control" placeholder="Write a comment or status update..." required>
          <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Post Reply</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
