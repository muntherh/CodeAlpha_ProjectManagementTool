<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board | CodeAlpha Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="brand">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        CodeAlpha Kanban
      </a>
      <span class="divider"></span>
      <select id="project-selector" class="project-select" onchange="switchProject(this.value)" aria-label="Project">
        <option value="">Loading projects…</option>
      </select>
    </div>

    <div class="header-right">
      <button onclick="openModal('new-project-modal')" class="btn btn-light">New project</button>
      <button onclick="openModal('new-task-modal')" class="btn btn-primary">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New task
      </button>
      <div id="auth-nav" class="user-chip"></div>
    </div>
  </header>

  <section class="project-head">
    <div>
      <h1 id="project-heading">&nbsp;</h1>
      <p id="project-desc"></p>
    </div>
    <div class="project-stats" id="project-stats"></div>
  </section>
  <div class="progress"><span id="project-progress"></span></div>

  <main class="board-container">
    <div class="kanban-column" id="col-todo" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'todo')">
      <div class="column-header">
        <span class="status-mark todo"></span> To do
        <span id="badge-todo" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </div>

    <div class="kanban-column" id="col-in_progress" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'in_progress')">
      <div class="column-header">
        <span class="status-mark in_progress"></span> In progress
        <span id="badge-in_progress" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-in_progress"></div>
    </div>

    <div class="kanban-column" id="col-review" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'review')">
      <div class="column-header">
        <span class="status-mark review"></span> In review
        <span id="badge-review" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-review"></div>
    </div>

    <div class="kanban-column" id="col-done" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'done')">
      <div class="column-header">
        <span class="status-mark done"></span> Done
        <span id="badge-done" class="col-badge">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </div>
  </main>

  <!-- Modal: Create Project -->
  <div id="new-project-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>New project</h3>
        <button class="close-btn" onclick="closeModal('new-project-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="create-project-form">
          <div class="form-group">
            <label for="proj-title">Title</label>
            <input type="text" id="proj-title" class="form-control" placeholder="Mobile app v2" maxlength="80" required>
          </div>
          <div class="form-group">
            <label for="proj-desc">Description</label>
            <textarea id="proj-desc" class="form-control" rows="3" placeholder="What is this project about?"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-text" onclick="closeModal('new-project-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Create project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Create Task -->
  <div id="new-task-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>New task</h3>
        <button class="close-btn" onclick="closeModal('new-task-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="create-task-form">
          <div class="form-group">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" class="form-control" placeholder="Design the landing page" maxlength="120" required>
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" class="form-control" rows="3" placeholder="Add details, links or acceptance criteria"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority" class="form-control">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group">
              <label for="task-assignee">Assignee</label>
              <select id="task-assignee" class="form-control">
                <option value="">Unassigned</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="task-duedate">Due date</label>
            <input type="date" id="task-duedate" class="form-control">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-text" onclick="closeModal('new-task-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Add task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Task Details & Comments -->
  <div id="task-detail-modal" class="modal-overlay">
    <div class="modal-card" style="max-width: 620px;">
      <div class="modal-header">
        <div>
          <div class="modal-kicker" id="modal-task-key"></div>
          <h3 id="modal-task-title">Task</h3>
        </div>
        <button class="close-btn" onclick="closeModal('task-detail-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-task-meta"></div>
        <div class="section-label">Description</div>
        <p id="modal-task-desc"></p>

        <div class="section-label">Comments</div>
        <div id="modal-comments-list" class="comment-list"></div>

        <form id="add-comment-form" class="comment-form">
          <input type="text" id="comment-input" class="form-control" placeholder="Write a comment…" maxlength="1000" required>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
